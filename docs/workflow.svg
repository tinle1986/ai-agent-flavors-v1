<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 936" width="990" height="936" role="img" aria-labelledby="t d">
<title id="t">Agent collaboration workflow</title>
<desc id="d">Six-stage loop: validate the bet, plan, design, build and verify, release and run, measure and report. Each stage hands a deliverable to the next through an owner approval gate, and the measured report loops back into strategy.</desc>
<style>
  .bg{fill:#ffffff} .band{fill:#eceff4} .chip{fill:#ffffff;stroke:#dde1e8} .opt{stroke:#5b6270;stroke-dasharray:4 3}
  .ph{font:700 14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#16191f}
  .nm{font:600 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#16191f}
  .q,.role,.gate2{font:11px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#5b6270}
  .gate1{font:600 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#16191f}
  .art{font:11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#16191f}
  .hand{stroke:#16191f;stroke-width:1.5;fill:none} .ah{fill:#16191f}
  .loop{stroke:#2346c8;stroke-width:2;fill:none} .ahb{fill:#2346c8}
  .looptxt{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#2346c8}
  .diamond{fill:#fbf0d9;stroke:#9a6200;stroke-width:1.5}
  .purple{fill:#7a3fd1} .yellow{fill:#b48a00} .cyan{fill:#0a8a9e} .orange{fill:#d0611a} .blue{fill:#2a64d6}
  .pink{fill:#c2337a} .green{fill:#2a8a4a} .red{fill:#c4302b} .magenta{fill:#b02ab0}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .band{fill:#161b22} .chip{fill:#0d1117;stroke:#30363d} .opt{stroke:#8b949e}
    .ph,.nm,.gate1,.art{fill:#e6edf3} .q,.role,.gate2{fill:#8b949e}
    .hand{stroke:#e6edf3} .ah{fill:#e6edf3}
    .loop{stroke:#8aa4ff} .ahb{fill:#8aa4ff} .looptxt{fill:#8aa4ff}
    .diamond{fill:#2d2412;stroke:#f0be5c}
    .purple{fill:#b08cff} .yellow{fill:#e8c547} .cyan{fill:#4fd0e2} .orange{fill:#ff9a57} .blue{fill:#7fa7ff}
    .pink{fill:#ff7ab8} .green{fill:#6fd29b} .red{fill:#ff7d75} .magenta{fill:#ee7cee}
  }</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahb" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="990" height="936" rx="14"/>
<rect class="band" x="20" y="20" width="850" height="96" rx="12"/>
<text class="q" x="38" y="46">STAGE 1</text><text class="ph" x="38" y="67">Validate the bet</text><text class="q" x="38" y="86">Is it worth building?</text>
<rect class="chip" x="186" y="30" width="158" height="34" rx="8"/><circle class="purple" cx="200" cy="47" r="5"/><text class="nm" x="212" y="45">CEO / BizDev</text><text class="role" x="212" y="58">the bet, go/no-go</text>
<rect class="chip" x="352" y="30" width="158" height="34" rx="8"/><circle class="green" cx="366" cy="47" r="5"/><text class="nm" x="378" y="45">Finance</text><text class="role" x="378" y="58">unit economics</text>
<rect class="chip" x="518" y="30" width="158" height="34" rx="8"/><circle class="blue" cx="532" cy="47" r="5"/><text class="nm" x="544" y="45">Data Analyst</text><text class="role" x="544" y="58">demand evidence</text>
<rect class="chip" x="684" y="30" width="158" height="34" rx="8"/><circle class="orange" cx="698" cy="47" r="5"/><text class="nm" x="710" y="45">Copywriter</text><text class="role" x="710" y="58">positioning test</text>
<rect class="chip opt" x="186" y="72" width="158" height="34" rx="8"/><circle class="cyan" cx="200" cy="89" r="5"/><text class="nm" x="212" y="87">Freelancer</text><text class="role" x="212" y="100">solo-maker path</text>
<line class="hand" x1="514" y1="118" x2="514" y2="177" marker-end="url(#ah)"/>
<polygon class="diamond" points="514,139 523,148 514,157 505,148"/><text class="gate1" x="496" y="146" text-anchor="end">Go / no-go</text><text class="gate2" x="496" y="160" text-anchor="end">owner approves</text>
<text class="art" x="534" y="152">approved bet · budget · target KPIs</text>
<rect class="band" x="20" y="180" width="850" height="96" rx="12"/>
<text class="q" x="38" y="206">STAGE 2</text><text class="ph" x="38" y="227">Plan</text><text class="q" x="38" y="246">What do we build first?</text>
<rect class="chip" x="186" y="190" width="158" height="34" rx="8"/><circle class="blue" cx="200" cy="207" r="5"/><text class="nm" x="212" y="205">Product Owner</text><text class="role" x="212" y="218">sprint goal, priority</text>
<rect class="chip" x="352" y="190" width="158" height="34" rx="8"/><circle class="yellow" cx="366" cy="207" r="5"/><text class="nm" x="378" y="205">BA</text><text class="role" x="378" y="218">stories + criteria</text>
<rect class="chip" x="518" y="190" width="158" height="34" rx="8"/><circle class="magenta" cx="532" cy="207" r="5"/><text class="nm" x="544" y="205">UI/UX</text><text class="role" x="544" y="218">flows, wireframes</text>
<rect class="chip" x="684" y="190" width="158" height="34" rx="8"/><circle class="orange" cx="698" cy="207" r="5"/><text class="nm" x="710" y="205">Scrum Master</text><text class="role" x="710" y="218">capacity, timebox</text>
<line class="hand" x1="514" y1="278" x2="514" y2="337" marker-end="url(#ah)"/>
<polygon class="diamond" points="514,299 523,308 514,317 505,308"/><text class="gate1" x="496" y="306" text-anchor="end">Definition of Ready</text><text class="gate2" x="496" y="320" text-anchor="end">PO + BA + Scrum</text>
<text class="art" x="534" y="312">ready stories · criteria · wireframes</text>
<rect class="band" x="20" y="340" width="850" height="96" rx="12"/>
<text class="q" x="38" y="366">STAGE 3</text><text class="ph" x="38" y="387">Design</text><text class="q" x="38" y="406">How will it work?</text>
<rect class="chip" x="186" y="350" width="158" height="34" rx="8"/><circle class="orange" cx="200" cy="367" r="5"/><text class="nm" x="212" y="365">Solution Architect</text><text class="role" x="212" y="378">stack, hosting, ADR</text>
<rect class="chip" x="352" y="350" width="158" height="34" rx="8"/><circle class="yellow" cx="366" cy="367" r="5"/><text class="nm" x="378" y="365">Software Architect</text><text class="role" x="378" y="378">modules, boundaries</text>
<rect class="chip" x="518" y="350" width="158" height="34" rx="8"/><circle class="red" cx="532" cy="367" r="5"/><text class="nm" x="544" y="365">Security</text><text class="role" x="544" y="378">threat model</text>
<rect class="chip" x="684" y="350" width="158" height="34" rx="8"/><circle class="blue" cx="698" cy="367" r="5"/><text class="nm" x="710" y="365">DBA</text><text class="role" x="710" y="378">schema design</text>
<rect class="chip" x="186" y="392" width="158" height="34" rx="8"/><circle class="pink" cx="200" cy="409" r="5"/><text class="nm" x="212" y="407">Data Engineer</text><text class="role" x="212" y="420">event pipeline</text>
<rect class="chip opt" x="352" y="392" width="158" height="34" rx="8"/><circle class="purple" cx="366" cy="409" r="5"/><text class="nm" x="378" y="407">AI Harness</text><text class="role" x="378" y="420">AI parts, evals</text>
<line class="hand" x1="514" y1="438" x2="514" y2="497" marker-end="url(#ah)"/>
<polygon class="diamond" points="514,459 523,468 514,477 505,468"/><text class="gate1" x="496" y="466" text-anchor="end">Design review</text><text class="gate2" x="496" y="480" text-anchor="end">owner approves ADRs</text>
<text class="art" x="534" y="472">ADRs · schema · threat model · tracking</text>
<rect class="band" x="20" y="500" width="850" height="96" rx="12"/>
<text class="q" x="38" y="526">STAGE 4</text><text class="ph" x="38" y="547">Build &amp; verify</text><text class="q" x="38" y="566">Does it work?</text>
<rect class="chip" x="186" y="510" width="158" height="34" rx="8"/><circle class="cyan" cx="200" cy="527" r="5"/><text class="nm" x="212" y="525">Full-Stack</text><text class="role" x="212" y="538">code + tests</text>
<rect class="chip" x="352" y="510" width="158" height="34" rx="8"/><circle class="yellow" cx="366" cy="527" r="5"/><text class="nm" x="378" y="525">Software Architect</text><text class="role" x="378" y="538">PR design review</text>
<rect class="chip" x="518" y="510" width="158" height="34" rx="8"/><circle class="red" cx="532" cy="527" r="5"/><text class="nm" x="544" y="525">QA</text><text class="role" x="544" y="538">test plan, verify</text>
<rect class="chip" x="684" y="510" width="158" height="34" rx="8"/><circle class="red" cx="698" cy="527" r="5"/><text class="nm" x="710" y="525">Security</text><text class="role" x="710" y="538">code audit</text>
<rect class="chip" x="186" y="552" width="158" height="34" rx="8"/><circle class="green" cx="200" cy="569" r="5"/><text class="nm" x="212" y="567">Tech Writer</text><text class="role" x="212" y="580">docs, runbook</text>
<rect class="chip" x="352" y="552" width="158" height="34" rx="8"/><circle class="orange" cx="366" cy="569" r="5"/><text class="nm" x="378" y="567">Scrum Master</text><text class="role" x="378" y="580">standups, blockers</text>
<line class="hand" x1="514" y1="598" x2="514" y2="657" marker-end="url(#ah)"/>
<polygon class="diamond" points="514,619 523,628 514,637 505,628"/><text class="gate1" x="496" y="626" text-anchor="end">Definition of Done</text><text class="gate2" x="496" y="640" text-anchor="end">QA, Security, Architect; owner releases</text>
<text class="art" x="534" y="632">tested build · docs · runbook</text>
<rect class="band" x="20" y="660" width="850" height="96" rx="12"/>
<text class="q" x="38" y="686">STAGE 5</text><text class="ph" x="38" y="707">Release &amp; run</text><text class="q" x="38" y="726">Is it live and healthy?</text>
<rect class="chip" x="186" y="670" width="158" height="34" rx="8"/><circle class="pink" cx="200" cy="687" r="5"/><text class="nm" x="212" y="685">DevOps</text><text class="role" x="212" y="698">deploy, monitor</text>
<rect class="chip" x="352" y="670" width="158" height="34" rx="8"/><circle class="blue" cx="366" cy="687" r="5"/><text class="nm" x="378" y="685">DBA</text><text class="role" x="378" y="698">migrate, backup</text>
<rect class="chip" x="518" y="670" width="158" height="34" rx="8"/><circle class="orange" cx="532" cy="687" r="5"/><text class="nm" x="544" y="685">Copywriter</text><text class="role" x="544" y="698">launch copy</text>
<line class="hand" x1="514" y1="758" x2="514" y2="817" marker-end="url(#ah)"/>
<text class="art" x="534" y="792">live feature · usage events · costs</text>
<rect class="band" x="20" y="820" width="850" height="96" rx="12"/>
<text class="q" x="38" y="846">STAGE 6</text><text class="ph" x="38" y="867">Measure &amp; report</text><text class="q" x="38" y="886">Did it pay off?</text>
<rect class="chip" x="186" y="830" width="158" height="34" rx="8"/><circle class="blue" cx="200" cy="847" r="5"/><text class="nm" x="212" y="845">Data Analyst</text><text class="role" x="212" y="858">KPI report</text>
<rect class="chip" x="352" y="830" width="158" height="34" rx="8"/><circle class="green" cx="366" cy="847" r="5"/><text class="nm" x="378" y="845">Finance</text><text class="role" x="378" y="858">actual vs plan</text>
<rect class="chip" x="518" y="830" width="158" height="34" rx="8"/><circle class="orange" cx="532" cy="847" r="5"/><text class="nm" x="544" y="845">Scrum Master</text><text class="role" x="544" y="858">review, retro</text>
<rect class="chip" x="684" y="830" width="158" height="34" rx="8"/><circle class="blue" cx="698" cy="847" r="5"/><text class="nm" x="710" y="845">Product Owner</text><text class="role" x="710" y="858">accept, reprioritize</text>
<rect class="chip" x="186" y="872" width="158" height="34" rx="8"/><circle class="yellow" cx="200" cy="889" r="5"/><text class="nm" x="212" y="887">Software Architect</text><text class="role" x="212" y="900">tech-debt review</text>
<rect class="chip" x="352" y="872" width="158" height="34" rx="8"/><circle class="purple" cx="366" cy="889" r="5"/><text class="nm" x="378" y="887">CEO / BizDev</text><text class="role" x="378" y="900">next bets</text>
<path class="loop" d="M 870 868 H 944 V 68 H 874" marker-end="url(#ahb)"/>
<text class="looptxt" transform="translate(964 468) rotate(-90)" text-anchor="middle">KPI report + learnings → next plan</text>
</svg>
